<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#14201f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>学習ログ</title>
<style>
/* ===== デザイントークン（計器盤 × 航空日誌）／外部依存ゼロ ===== */
:root{
  --bg:#14201f; --surface:#1b2a28; --surface2:#213432; --line:#2c3d3a;
  --ink:#e8ede9; --muted:#8fa39d; --faint:#5f736e;
  --accent:#e0a93b; --done:#6fae86; --warn:#d98a6a;
  --radius:14px; --radius-sm:10px;
  --font:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --bg:#e9ece6; --surface:#f6f7f3; --surface2:#eef0ea; --line:#d5dbd3;
  --ink:#16211f; --muted:#5c6a66; --faint:#8b9691;
  --accent:#b9812a; --done:#3f8a5c; --warn:#b8613f; --shadow:0 6px 20px rgba(20,32,31,.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--font); font-feature-settings:"palt"; line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); overscroll-behavior-y:none;}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

header{position:sticky; top:0; z-index:20; background:var(--bg); display:flex; align-items:center; justify-content:space-between; padding:14px 18px 10px; border-bottom:1px solid var(--line);}
header .brand{display:flex; align-items:baseline; gap:10px}
header h1{font-size:18px; font-weight:650; letter-spacing:.04em; margin:0}
header .sub{font-size:11px; color:var(--faint); letter-spacing:.12em}
.iconbtn{background:none; border:1px solid var(--line); border-radius:10px; width:38px; height:38px; display:grid; place-items:center; color:var(--muted)}
.iconbtn:active{background:var(--surface2)}
main{padding:14px 16px 100px; max-width:640px; margin:0 auto}
section.view{display:none} section.view.active{display:block}

nav.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; display:grid; grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--bg) 92%, transparent); backdrop-filter:blur(8px); border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
nav.tabbar button{background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0; color:var(--faint); font-size:10.5px; letter-spacing:.04em; border-radius:10px}
nav.tabbar button .g{width:23px; height:23px}
nav.tabbar button.active{color:var(--accent)}
nav.tabbar button{font-size:10px}

/* セグメント切替（週/日・期間） */
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.seg button{background:none; border:0; padding:6px 13px; font-size:12.5px; color:var(--faint)}
.seg button.on{background:var(--surface2); color:var(--ink)}

/* 予定：週・日 共通 */
.plantop{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.plantop .rng{font-size:13px; color:var(--muted)}
.plantop .nav{display:flex; gap:6px}
.plantop .nav button{background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:7px 11px; font-size:13px; color:var(--muted)}
.day{margin:0 0 6px}
.day .dhead{display:flex; align-items:center; gap:8px; padding:10px 4px 6px; position:sticky; top:63px; background:var(--bg); z-index:5}
.day .dnum{font-size:15px; font-weight:650}
.day .dwk{font-size:12px; color:var(--faint)}
.day.today .dnum{color:var(--accent)}
.day .dtot{margin-left:auto; font-size:11px; color:var(--faint)}
.day.tap .dhead{cursor:pointer}
.day .empty{color:var(--faint); font-size:12px; padding:4px 6px 8px}
.daysum{display:flex; gap:8px; flex-wrap:wrap; margin:2px 0 10px}
.daysum .pill{font-size:11.5px; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:5px 11px; display:flex; align-items:center; gap:6px}
.daysum .pill .cdot{width:8px;height:8px;border-radius:50%}

.task{display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 12px; margin:6px 0}
.task:active{background:var(--surface2)}
.task .dot{width:9px; height:9px; border-radius:50%; flex:none}
.task .body{min-width:0; flex:1}
.task .ttl{font-size:14.5px; line-height:1.35; word-break:break-word}
.task.done .ttl{color:var(--faint); text-decoration:line-through}
.task .meta{font-size:11.5px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap}
.task .meta .carry{color:var(--warn)}
.task .check{width:26px; height:26px; border-radius:8px; border:1.5px solid var(--line); background:none; flex:none; display:grid; place-items:center; color:transparent}
.task.done .check{background:var(--done); border-color:var(--done); color:#0c1614}
.weekfoot{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap}
.weekfoot button{flex:1; min-width:140px; background:var(--surface); border:1px solid var(--line); color:var(--muted); border-radius:var(--radius-sm); padding:11px; font-size:12.5px}

.fab{position:fixed; right:18px; bottom:calc(82px + env(safe-area-inset-bottom)); z-index:25; width:56px; height:56px; border-radius:18px; border:0; background:var(--accent); color:#12100a; font-size:30px; display:grid; place-items:center; box-shadow:var(--shadow)}
.fab:active{transform:scale(.96)}

/* タイマー */
.timerwrap{text-align:center; padding:8px 0 0}
.timer-sub{font-size:12px; color:var(--faint); letter-spacing:.14em; margin-bottom:10px}
.chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:12px}
.chip{border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:999px; padding:8px 14px; font-size:13px; display:flex; align-items:center; gap:7px}
.chip .cdot{width:8px; height:8px; border-radius:50%}
.chip.on{border-color:var(--accent); color:var(--ink); background:var(--surface2)}
.chip.mat{font-size:12.5px; padding:7px 12px}
.chip.add{color:var(--faint); border-style:dashed}
.matlabel{font-size:11px; color:var(--faint); letter-spacing:.1em; margin:2px 0 8px}
.dial{margin:6px auto 4px; width:min(72vw,290px); height:min(72vw,290px); border-radius:50%; display:grid; place-items:center; position:relative; border:1px solid var(--line); background:radial-gradient(circle at 50% 42%, var(--surface2), var(--surface) 70%)}
.dial.run{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 0 40px -8px var(--accent)}
.dial .time{font-size:42px; font-weight:300}
.dial.run .time{color:var(--accent)}
.dial .lbl{font-size:12px; color:var(--faint); margin-top:8px; min-height:16px; max-width:82%}
.timer-actions{display:flex; gap:10px; justify-content:center; margin-top:20px}
.btn{border:0; border-radius:14px; padding:15px 30px; font-size:16px; font-weight:600; letter-spacing:.04em}
.btn.primary{background:var(--accent); color:#12100a}
.btn.stop{background:var(--warn); color:#160e0a}
.btn.ghost{background:var(--surface); color:var(--muted); border:1px solid var(--line); font-weight:500; padding:15px 20px}
.btn:active{transform:scale(.97)}

/* 記録フィード */
.feedtop{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
.feedtop button{background:var(--surface); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:9px 14px; font-size:13px}
.fdate{font-size:12px; color:var(--faint); letter-spacing:.06em; margin:14px 2px 6px}
.frow{display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 12px; margin:6px 0}
.frow:active{background:var(--surface2)}
.frow .dot{width:9px;height:9px;border-radius:50%;flex:none}
.frow .body{flex:1; min-width:0}
.frow .ttl{font-size:14px}
.frow .meta{font-size:11px; color:var(--faint); margin-top:2px}
.frow .fmin{font-size:13px; color:var(--muted)}
.ftag{background:var(--surface2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:10px; color:var(--muted)}

/* 分析 */
.stat-row{display:flex; gap:10px; margin-bottom:16px}
.stat{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px}
.stat .v{font-size:23px; font-weight:600}
.stat .v small{font-size:12px; font-weight:500; color:var(--muted)}
.stat .k{font-size:11px; color:var(--faint); margin-top:3px; letter-spacing:.06em}
.stat.streak .v{color:var(--accent)}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px; margin-bottom:16px}
.card h3{margin:0 0 12px; font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.06em; display:flex; justify-content:space-between; align-items:center; gap:8px}
.stackwrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
.stack{display:flex; align-items:flex-end; gap:5px; height:120px; min-width:100%}
.stack .col{flex:1; min-width:16px; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end}
.stack .barwrap{width:72%; display:flex; flex-direction:column-reverse; border-radius:3px 3px 0 0; overflow:hidden}
.stack .seg2{width:100%}
.stack .cl{font-size:9.5px; color:var(--faint); white-space:nowrap}
.stack .col.today .cl{color:var(--accent)}
.legend{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px}
.legend span{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px}
.legend .cdot{width:9px;height:9px;border-radius:2px}
.bar{display:flex; align-items:center; gap:10px; margin:9px 0; font-size:13px}
.bar.sub{cursor:pointer}
.bar .bl{width:96px; flex:none; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px}
.bar .bl .caret{color:var(--faint); font-size:10px; width:10px}
.bar .btrack{flex:1; height:12px; background:var(--surface2); border-radius:6px; overflow:hidden}
.bar .bfill{height:100%; border-radius:6px}
.bar .bv{width:60px; flex:none; text-align:right; color:var(--muted); font-size:12px}
.bar.matrow{margin-left:14px; font-size:12px}
.bar.matrow .bl{width:110px; color:var(--faint); font-size:12px}
.bar.matrow .btrack{height:9px}
.emptybox{color:var(--faint); font-size:13px; text-align:center; padding:18px 8px; line-height:1.7}

/* モーダル */
.overlay{position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.5); display:none; align-items:flex-end; justify-content:center}
.overlay.open{display:flex}
.sheet{width:100%; max-width:520px; background:var(--surface); border:1px solid var(--line); border-radius:20px 20px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom)); max-height:86vh; overflow:auto; box-shadow:var(--shadow)}
.sheet h2{margin:2px 0 16px; font-size:16px; font-weight:650}
.field{margin-bottom:14px}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; letter-spacing:.04em}
.field input, .field select{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:12px; font-size:15px; font-family:inherit}
.field .row{display:flex; gap:10px}
.field .row > *{flex:1}
.field .chips{justify-content:flex-start; margin-bottom:0}
.sheet .actions{display:flex; gap:10px; margin-top:20px; margin-bottom:6px}
.sheet .actions .btn{flex:1; padding:14px; font-size:15px}
.list-item{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line); font-size:15px}
.list-item:last-child{border-bottom:0}
.list-item .li-ic{width:22px; text-align:center; color:var(--muted)}
.list-item.danger{color:var(--warn)}
.subrow{display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line)}
.subrow .sw{width:20px; height:20px; border-radius:6px; flex:none}
.subrow .snm{flex:1; font-size:15px}
.subrow button{background:none; border:0; color:var(--muted); padding:6px 7px; font-size:13px}
.palette{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px}
.palette .pc{width:30px; height:30px; border-radius:8px; border:2px solid transparent}
.palette .pc.on{border-color:var(--ink)}
.toast{position:fixed; left:50%; bottom:calc(98px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:999px; font-size:13px; z-index:80; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; white-space:nowrap}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}
.hint{font-size:12px; color:var(--faint); line-height:1.7; margin-top:2px}

/* 配分タブ */
.alloc-tools{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px}
.alloc-tools button{flex:1; min-width:100px; background:var(--surface); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:10px 8px; font-size:12.5px}
.alloc-tools button:active{background:var(--surface2)}
.alloc-hint{margin-bottom:12px}
.aday{display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:10px 12px; margin:6px 0}
.aday.today{border-color:var(--accent)}
.aday .adate{width:58px; flex:none; font-size:13px}
.aday .adate .aw{color:var(--faint); font-size:11px; margin-left:4px}
.aday select{flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px; font-size:13px; font-family:inherit}
.aday .acap{width:64px; flex:none; text-align:right; font-size:12px; color:var(--muted)}
.blockrow{display:flex; align-items:center; gap:8px; margin:8px 0}
.blockrow input[type=time]{flex:1; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px; font-size:14px; font-family:inherit}
.blockrow .soft{display:flex; align-items:center; gap:4px; font-size:11px; color:var(--muted); white-space:nowrap}
.blockrow button.rm{background:none; border:0; color:var(--warn); font-size:18px; padding:0 4px}
.tgrow{display:flex; align-items:center; gap:8px; padding:11px 0; border-bottom:1px solid var(--line); flex-wrap:wrap}
.tgrow .tgn{width:100%; font-size:14px; display:flex; align-items:center; gap:7px; margin-bottom:2px}
.tgrow .tgn .cdot{width:9px;height:9px;border-radius:50%}
.tgrow label{font-size:11px; color:var(--faint); display:flex; flex-direction:column; gap:3px; flex:1}
.tgrow input{background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:8px; font-size:14px; font-family:inherit; width:100%}
.pvday{margin:10px 0 4px; font-size:12px; color:var(--faint)}
.pvrow{display:flex; align-items:center; gap:10px; padding:5px 0; font-size:13px}
.pvrow .pd{width:9px;height:9px;border-radius:50%;flex:none}
.pvrow .pn{flex:1}
.pvrow .pv{color:var(--muted); font-size:12px}
.pvwarn{background:var(--surface2); border:1px solid var(--warn); border-radius:8px; padding:10px 12px; margin:12px 0; font-size:12.5px; color:var(--ink)}
.pvok{color:var(--done); font-size:12.5px; margin:10px 0}
.mtrow{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px}
.mtrow .cdot{width:9px;height:9px;border-radius:50%;flex:none}
.mtrow .mtn{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mtrow .mtu{width:60px; flex:none; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:7px; font-size:14px; font-family:inherit}
.mtrow .mtul{color:var(--faint); font-size:11px; flex:none}
.mtrow .mtdel{background:none;border:0;color:var(--warn);font-size:18px;padding:0 4px}
.mtadd{display:flex; gap:8px; margin-top:10px}
.mtadd select{flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px; font-size:13px; font-family:inherit}
.mtadd input{width:70px; flex:none; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px; font-size:14px; font-family:inherit}
.updbar{position:fixed; left:0; right:0; top:0; z-index:90; background:var(--accent); color:#12100a; display:flex; align-items:center; justify-content:center; gap:12px; padding:calc(8px + env(safe-area-inset-top)) 12px 8px; font-size:13px; font-weight:600}
.updbar button{background:#12100a; color:var(--accent); border:0; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:600}

/* ===== v5：全画面モーダル ===== */
.overlay.full{align-items:stretch}
.overlay.full .sheet{max-width:560px; height:100%; max-height:100%; border-radius:0; padding:0; display:flex; flex-direction:column}
.fhead{position:sticky; top:0; display:flex; align-items:center; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 14px 12px; border-bottom:1px solid var(--line); background:var(--surface); z-index:2}
.fhead .x{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--muted);display:grid;place-items:center;flex:none;font-size:20px}
.fhead .ft{font-size:16px; font-weight:650; flex:1}
.fhead .fsave{background:var(--accent); color:#12100a; border:0; border-radius:10px; padding:9px 16px; font-size:14px; font-weight:600}
.fbody{flex:1; overflow:auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom))}

/* ===== 教材アイコン ===== */
.micon{border-radius:26%; overflow:hidden; flex:none; display:grid; place-items:center; color:#12100a; font-weight:700; background:var(--surface2)}
.micon img{width:100%;height:100%;object-fit:cover;display:block}
.micon.s{width:22px;height:22px;font-size:11px;border-radius:24%}
.micon.m{width:30px;height:30px;font-size:14px}
.micon.l{width:44px;height:44px;font-size:20px}
.micon.xl{width:76px;height:76px;font-size:34px;border-radius:24%}
.iconpick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.iconpick button{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;font-size:22px;display:grid;place-items:center}
.iconpick button.on{border-color:var(--accent);background:var(--surface2)}
.iconopts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.iconopts button{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px;font-size:13px}

/* ===== 画像クロップ ===== */
.cropwrap{width:min(80vw,320px);height:min(80vw,320px);margin:8px auto;border-radius:16px;overflow:hidden;position:relative;background:#000;touch-action:none}
.cropwrap img{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none}
.cropwrap .grid{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.crophint{text-align:center;font-size:12px;color:var(--faint);margin-top:8px}

/* ===== タスクのカード化（アイコン＋進捗バー＋科目色帯）===== */
.task{border-left:3px solid var(--tc,var(--line))}
.task .ticon{margin-right:2px}
.prog{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:6px}
.prog>span{display:block;height:100%;border-radius:3px;background:var(--done)}
.task.auto{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 10%,var(--surface)),var(--surface) 40%)}
.check.pop{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* 今日の残り */
.todaybar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
.todaybar b{color:var(--ink);font-weight:650}
.todaybar .sp{margin-left:auto;color:var(--faint)}

/* タイマーの教材アイコン */
.dial .ticonbig{margin-bottom:6px}
</style>
</head>
<body>

<header>
  <div class="brand"><h1>学習ログ</h1><span class="sub">LOGBOOK</span></div>
  <button class="iconbtn" id="btnData" aria-label="データと設定">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
  </button>
</header>

<main>
  <!-- 予定（週/日） -->
  <section class="view active" id="view-plan">
    <div class="plantop">
      <span class="seg" id="modeSeg"><button data-m="week" class="on">週</button><button data-m="day">日</button></span>
      <div class="rng num" id="planRange">—</div>
      <div class="nav"><button id="pPrev">‹</button><button id="pToday">今日</button><button id="pNext">›</button></div>
    </div>
    <div id="planBody"></div>
    <div class="weekfoot" id="weekFoot">
      <button id="carryOverdue">期限切れの未完了を今日へ</button>
      <button id="carryNextWeek">今週の未完了を来週へ</button>
    </div>
  </section>

  <!-- タイマー -->
  <section class="view" id="view-timer">
    <div class="timerwrap">
      <div class="timer-sub">科目を選んで開始</div>
      <div class="chips" id="timerChips"></div>
      <div class="matlabel" id="timerMatLabel" style="display:none">教材（任意）</div>
      <div class="chips" id="timerMat"></div>
      <div class="dial" id="dial"><div><div class="time num" id="timeDisp">00:00:00</div><div class="lbl" id="timerLbl"></div></div></div>
      <div class="timer-actions">
        <button class="btn primary" id="btnStartStop">開始</button>
        <button class="btn ghost" id="btnDiscard" style="display:none">破棄</button>
      </div>
    </div>
  </section>

  <!-- 記録フィード -->
  <section class="view" id="view-feed">
    <div class="feedtop">
      <div style="font-size:13px;color:var(--muted)">学習の記録</div>
      <button id="addManual">＋ 手動で記録</button>
    </div>
    <div id="feedList"></div>
  </section>

  <!-- 分析 -->
  <section class="view" id="view-stats">
    <div class="stat-row">
      <div class="stat"><div class="v num" id="statToday">—</div><div class="k">今日</div></div>
      <div class="stat"><div class="v num" id="statWeek">—</div><div class="k">今週</div></div>
      <div class="stat streak"><div class="v num" id="statStreak">—</div><div class="k">連続記録</div></div>
    </div>
    <div class="card">
      <h3>日別の積み上げ（直近14日）</h3>
      <div class="stackwrap"><div class="stack" id="stack"></div></div>
      <div class="legend" id="stackLegend"></div>
    </div>
    <div class="card">
      <h3>科目・教材別の累積
        <span class="seg" id="periodSeg"><button data-p="week" class="on">今週</button><button data-p="month">今月</button><button data-p="all">全期間</button></span>
      </h3>
      <div id="breakdown"></div>
      <div class="hint" id="bkHint" style="display:none">科目をタップすると教材別の内訳が開きます。</div>
    </div>
  </section>
  <!-- 配分 -->
  <section class="view" id="view-alloc">
    <div class="plantop">
      <div class="rng num" id="allocRange">—</div>
      <div class="nav"><button id="aPrev">‹</button><button id="aToday">今週</button><button id="aNext">›</button></div>
    </div>
    <div class="alloc-tools">
      <button id="mgTemplates">日型テンプレート</button>
      <button id="mgTargets">目標・フロア</button>
      <button id="tgCatchup">キャッチアップ：OFF</button>
    </div>
    <div class="alloc-hint hint">各日にテンプレートを割り当てると、その日の勉強可能時間（確実枠）が決まります。ソフト枠（平日夜など）は基本の配分では使わず、キャッチアップ時のみ使います。</div>
    <div id="allocDays"></div>
    <button class="btn primary" id="doPreview" style="width:100%;margin-top:8px">配分をプレビュー</button>
    <div class="alloc-hint hint" style="margin-top:12px">確定すると、この週の予定に「◯◯（配分）」として書き出されます。再実行しても、完了済み・手動で変更した予定は保護され、未着手の自動ぶんだけが組み直されます。</div>
  </section>

</main>

<button class="fab" id="fab" aria-label="予定を追加">＋</button>

<nav class="tabbar">
  <button data-tab="plan" class="active"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg>予定</button>
  <button data-tab="alloc"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h18M3 12h18M3 18h18M7 3v18"/></svg>配分</button>
  <button data-tab="timer"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9 2h6"/></svg>タイマー</button>
  <button data-tab="feed"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h10"/></svg>記録</button>
  <button data-tab="stats"><svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>分析</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================================
   学習ログ v2 — ローカルファーストPWA（サーバー無し／外部依存なし）
   科目→教材の2階層・週/日ビュー・記録フィード・積み上げ/教材別分析・手動記録
   ========================================================================= */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0'); const two = n => (n<10?'0':'')+n;
const esc = s => (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}

const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
function parseD(s){const[y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd);}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);}
function mondayOf(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x;}
const WK=['月','火','水','木','金','土','日'];
const wkOf = ds => WK[(parseD(ds).getDay()+6)%7];
function fmtDur(min){min=Math.round(min);if(min<=0)return'0分';const h=Math.floor(min/60),m=min%60;return(h?h+'時間':'')+(m||!h?m+'分':'');}
function fmtDurBig(min){const h=Math.floor(min/60),m=Math.round(min%60);return h?`${h}<small>時間</small>${m}<small>分</small>`:`${m}<small>分</small>`;}

/* ---------- IndexedDB（v2：materials追加） ---------- */
const DB_NAME='gakushu', DB_VER=2; let DB=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{const db=e.target.result;
    if(!db.objectStoreNames.contains('tasks'))    db.createObjectStore('tasks',{keyPath:'id'});
    if(!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions',{keyPath:'id'});
    if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'key'});
    if(!db.objectStoreNames.contains('materials'))db.createObjectStore('materials',{keyPath:'id'});};
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
const store=(n,m)=>DB.transaction(n,m).objectStore(n);
const getAll=n=>new Promise((res,rej)=>{const r=store(n,'readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const getOne=(n,k)=>new Promise((res,rej)=>{const r=store(n,'readonly').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const putV=(n,v)=>new Promise((res,rej)=>{const r=store(n,'readwrite').put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const delV=(n,k)=>new Promise((res,rej)=>{const r=store(n,'readwrite').delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
const clearV=n=>new Promise((res,rej)=>{const r=store(n,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});
async function setS(k,v){await putV('settings',{key:k,value:v});}
async function getS(k,d){const r=await getOne('settings',k);return r?r.value:d;}

/* ---------- 状態 ---------- */
let SUBJECTS=[], MATERIALS=[], TASKS=[], SESSIONS=[];
let planMode='week', dayDate=today(), weekStart=mondayOf(new Date());
let statPeriod='week', expanded=new Set();
let running=null, tick=null, selectedSub=null, selectedMat=null;
let HAPTICS=false;

const DEFAULT_SUBJECTS=[
  {name:'TOEFL',color:'#e0a93b'},{name:'専門科目',color:'#6fae86'},
  {name:'研究計画書',color:'#7fb0c9'},{name:'航空大',color:'#d98a6a'},{name:'その他',color:'#9a8fb0'}];
const PALETTE=['#e0a93b','#6fae86','#7fb0c9','#d98a6a','#9a8fb0','#c9a25f','#7fbfae','#c98fa8','#8f9bc9','#b0b06f'];

async function loadAll(){
  SUBJECTS=await getS('subjects',null)||(await setS('subjects',DEFAULT_SUBJECTS),DEFAULT_SUBJECTS);
  MATERIALS=await getAll('materials'); TASKS=await getAll('tasks'); SESSIONS=await getAll('sessions');
  running=await getS('running',null);
  HAPTICS=await getS('haptics',false)||false;
}
const colorOf=name=>(SUBJECTS.find(s=>s.name===name)||{}).color||'#9a8fb0';
const materialsOf=sub=>MATERIALS.filter(m=>m.subjectName===sub && !m.archived);
const materialName=id=>{const m=MATERIALS.find(x=>x.id===id);return m?m.name:'（削除済み教材）';};
const matById=id=>MATERIALS.find(m=>m.id===id);
const mpuOf=id=>{const m=matById(id);return (m&&m.minutesPerUnit)||30;};
const unitLabelOf=id=>{const m=matById(id);return (m&&m.unitLabel)||'単位';};
function addMaterial(sub,name){const m={id:uid(),name,subjectName:sub,archived:false,unitLabel:'単位',minutesPerUnit:30,splittable:true,obs:[],icon:null,createdTs:Date.now()};MATERIALS.push(m);return putV('materials',m).then(()=>m.id);}
const ICON_PRESETS=['📕','📘','📗','📙','📓','📖','✏️','🖊️','📝','🎧','🗣️','🔤','🧮','📐','🌐','✈️','💹','📊','🧠','⏱️','🔬','💬'];
function matIconHTML(m,size){
  const cls='micon '+(size||'m');
  if(m&&m.icon&&m.icon.type==='image'&&m.icon.data) return `<span class="${cls}"><img src="${m.icon.data}" alt=""></span>`;
  const bg=colorOf(m?m.subjectName:'');
  if(m&&m.icon&&m.icon.type==='preset'&&m.icon.value) return `<span class="${cls}" style="background:${bg}">${m.icon.value}</span>`;
  const ini=(m&&m.name)?[...m.name][0]:'?';
  return `<span class="${cls}" style="background:${bg}">${esc(ini)}</span>`;
}
/* 画像クロップ（正方形・ドラッグ＋ピンチ、96pxへリサイズしてJPEG化） */
function openCropper(file, cb){
  const url=URL.createObjectURL(file);
  $('#sheet').innerHTML=`<div class="fhead"><button class="x" id="crX" aria-label="閉じる">×</button><div class="ft">画像を調整</div><button class="fsave" id="crOK">決定</button></div>
    <div class="fbody"><div class="cropwrap" id="crBox"><img id="crImg" src="${url}"><div class="grid"></div></div><div class="crophint">ドラッグで移動・ピンチで拡大</div></div>`;
  $('#overlay').classList.add('open','full'); sheetClick=null;
  const box=$('#crBox'), img=$('#crImg');
  let C=box.clientWidth||280, nw=0,nh=0,base=1,scale=1,tx=0,ty=0;
  const apply=()=>{img.style.width=(nw*base*scale)+'px';img.style.height=(nh*base*scale)+'px';img.style.transform=`translate(${tx}px,${ty}px)`;};
  const clamp=()=>{const w=nw*base*scale,h=nh*base*scale;if(scale<1)scale=1;if(tx>0)tx=0;if(ty>0)ty=0;if(tx<C-w)tx=C-w;if(ty<C-h)ty=C-h;};
  img.onload=()=>{C=box.clientWidth||280;nw=img.naturalWidth;nh=img.naturalHeight;base=Math.max(C/nw,C/nh);scale=1;tx=(C-nw*base)/2;ty=(C-nh*base)/2;apply();};
  const pts=new Map(); let startDist=0,startScale=1,startMid=null,startTx=0,startTy=0,panLast=null;
  const dist=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
  const mid=()=>{const a=[...pts.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};};
  box.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.touches)pts.set(t.identifier,{x:t.clientX,y:t.clientY});
    if(e.touches.length>=2){startDist=dist();startScale=scale;startMid=mid();startTx=tx;startTy=ty;}else{panLast={x:e.touches[0].clientX,y:e.touches[0].clientY};}},{passive:false});
  box.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.touches){if(pts.has(t.identifier))pts.set(t.identifier,{x:t.clientX,y:t.clientY});}
    if(e.touches.length>=2){const r=box.getBoundingClientRect();scale=startScale*(dist()/startDist);const m=mid();
      const ix=(startMid.x-r.left-startTx)/(base*startScale), iy=(startMid.y-r.top-startTy)/(base*startScale);
      tx=(m.x-r.left)-ix*base*scale; ty=(m.y-r.top)-iy*base*scale; clamp();apply();}
    else if(e.touches.length===1&&panLast){const t=e.touches[0];tx+=t.clientX-panLast.x;ty+=t.clientY-panLast.y;panLast={x:t.clientX,y:t.clientY};clamp();apply();}},{passive:false});
  box.addEventListener('touchend',e=>{e.preventDefault();pts.clear();for(const t of e.touches)pts.set(t.identifier,{x:t.clientX,y:t.clientY});
    if(e.touches.length>=2){startDist=dist();startScale=scale;startMid=mid();startTx=tx;startTy=ty;panLast=null;}
    else if(e.touches.length===1){panLast={x:e.touches[0].clientX,y:e.touches[0].clientY};}else panLast=null;},{passive:false});
  let md=false,ml=null;
  box.addEventListener('mousedown',e=>{md=true;ml={x:e.clientX,y:e.clientY};});
  window.addEventListener('mousemove',e=>{if(!md)return;tx+=e.clientX-ml.x;ty+=e.clientY-ml.y;ml={x:e.clientX,y:e.clientY};clamp();apply();});
  window.addEventListener('mouseup',()=>{md=false;});
  $('#crX').onclick=()=>{URL.revokeObjectURL(url);closeSheet();};
  $('#crOK').onclick=()=>{const bs=base*scale;const sx=(0-tx)/bs,sy=(0-ty)/bs,sw=C/bs,sh=C/bs;
    const cv=document.createElement('canvas');cv.width=96;cv.height=96;const ctx=cv.getContext&&cv.getContext('2d');
    if(!ctx){toast('この環境では画像処理ができません');return;}
    try{ctx.drawImage(img,sx,sy,sw,sh,0,0,96,96);const data=cv.toDataURL('image/jpeg',0.82);URL.revokeObjectURL(url);cb(data);}catch(err){toast('画像の処理に失敗しました');}};
}

/* セッション由来の集計（実績はここから毎回算出＝手動編集にも整合） */
function actualMap(){const m={};SESSIONS.forEach(s=>{if(s.taskId)m[s.taskId]=(m[s.taskId]||0)+s.min;});return m;}
function dayTotalMap(){const m={};SESSIONS.forEach(s=>{const d=dstr(new Date(s.startTs));m[d]=(m[d]||0)+s.min;});return m;}

/* ---------- タブ ---------- */
function switchTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('#view-'+tab).classList.add('active');
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  $('#fab').style.display = tab==='plan' ? 'grid':'none';
  if(tab==='plan') renderPlan();
  if(tab==='alloc') renderAlloc();
  if(tab==='timer') renderTimer();
  if(tab==='feed') renderFeed();
  if(tab==='stats') renderStats();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav.tabbar button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

/* ================= 予定：週 / 日 ================= */
$('#modeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;planMode=b.dataset.m;
  $('#modeSeg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderPlan();});
$('#pPrev').onclick=()=>{ if(planMode==='week'){weekStart=parseD(addDays(dstr(weekStart),-7));} else {dayDate=addDays(dayDate,-1);} renderPlan(); };
$('#pNext').onclick=()=>{ if(planMode==='week'){weekStart=parseD(addDays(dstr(weekStart),7));} else {dayDate=addDays(dayDate,1);} renderPlan(); };
$('#pToday').onclick=()=>{ weekStart=mondayOf(new Date()); dayDate=today(); renderPlan(); };

function renderPlan(){
  $('#weekFoot').style.display = planMode==='week' ? 'flex':'none';
  planMode==='week' ? renderWeek() : renderDay();
}
function renderWeek(){
  const ws=dstr(weekStart), we=addDays(ws,6), a=parseD(ws), b=parseD(we);
  $('#planRange').textContent=`${a.getMonth()+1}/${a.getDate()} – ${b.getMonth()+1}/${b.getDate()}`;
  const body=$('#planBody'); body.innerHTML=todayRemainHTML(); const td=today();
  const act=actualMap(), dtot=dayTotalMap();
  for(let i=0;i<7;i++){
    const ds=addDays(ws,i), d=parseD(ds);
    const list=TASKS.filter(t=>t.date===ds).sort((x,y)=>(x.time||'99')>(y.time||'99')?1:-1);
    const el=document.createElement('div'); el.className='day tap'+(ds===td?' today':''); el.dataset.date=ds;
    let h=`<div class="dhead" data-goday="${ds}"><span class="dnum num">${d.getDate()}</span><span class="dwk">${WK[i]}</span>`
        +(dtot[ds]?`<span class="dtot num">記録 ${fmtDur(dtot[ds])}</span>`:``)+`</div>`;
    if(!list.length) h+=`<div class="empty">予定なし</div>`; else list.forEach(t=>h+=taskHTML(t,act));
    el.innerHTML=h; body.appendChild(el);
  }
}
function renderDay(){
  const d=parseD(dayDate), td=today();
  $('#planRange').textContent=`${d.getMonth()+1}/${d.getDate()}（${wkOf(dayDate)}）`;
  const body=$('#planBody'); const act=actualMap();
  const list=TASKS.filter(t=>t.date===dayDate).sort((x,y)=>(x.time||'99')>(y.time||'99')?1:-1);
  // その日の科目別合計
  const bySub={}; SESSIONS.filter(s=>dstr(new Date(s.startTs))===dayDate).forEach(s=>bySub[s.subject]=(bySub[s.subject]||0)+s.min);
  const sum=Object.entries(bySub).sort((a,b)=>b[1]-a[1]);
  let h=todayRemainHTML();
  h+=`<div class="day${dayDate===td?' today':''}"><div class="dhead"><span class="dnum num">${d.getDate()}</span><span class="dwk">${wkOf(dayDate)}</span></div></div>`;
  h+=sum.length?`<div class="daysum">`+sum.map(([n,m])=>`<span class="pill"><span class="cdot" style="background:${colorOf(n)}"></span>${esc(n)} ${fmtDur(m)}</span>`).join('')+`</div>`:``;
  if(!list.length) h+=`<div class="empty" style="padding:14px 6px">この日の予定はありません。右下の＋で追加できます。</div>`;
  else list.forEach(t=>h+=taskHTML(t,act));
  body.innerHTML=h;
}
function taskHTML(t,act){
  const c=colorOf(t.subject), a=act[t.id]||0, m=t.materialId?matById(t.materialId):null, meta=[];
  if(t.time) meta.push(`<span class="num">${t.time}</span>`);
  meta.push(esc(t.subject)+(t.materialId?` / ${esc(materialName(t.materialId))}`:''));
  if(t.plannedMin) meta.push(`<span class="num">予定 ${fmtDur(t.plannedMin)}</span>`);
  if(a) meta.push(`<span class="num">実績 ${fmtDur(a)}</span>`);
  if(t.carryCount) meta.push(`<span class="carry num">繰越${t.carryCount}</span>`);
  if(t.origin==='auto') meta.push(`<span style="color:var(--faint)">配分${t.materialId&&t.planUnits?` 約${t.planUnits}${unitLabelOf(t.materialId)}`:''}</span>`);
  const icon = m ? `<span class="ticon">${matIconHTML(m,'m')}</span>` : `<span class="dot" style="background:${c}"></span>`;
  const pct = (t.plannedMin && a) ? Math.min(100,Math.round(a/t.plannedMin*100)) : (a?100:0);
  const prog = (t.plannedMin) ? `<div class="prog"><span style="width:${pct}%;background:${a>=t.plannedMin?'var(--done)':c}"></span></div>` : ``;
  return `<div class="task${t.status==='done'?' done':''}${t.origin==='auto'?' auto':''}" data-id="${t.id}" style="--tc:${c}">${icon}
    <div class="body"><div class="ttl">${esc(t.title)}</div><div class="meta">${meta.join('<span style="color:var(--faint)">·</span>')}</div>${prog}</div>

/* ===== 実測補正（1単位=分）===== */
async function recordMpuObservation(sess){
  if(!sess.taskId||!sess.materialId) return;
  const task=TASKS.find(t=>t.id===sess.taskId);
  if(!task||!(task.planUnits>0)) return;               // 配分タスク（量つき）の実測のみ
  const m=matById(sess.materialId); if(!m) return;
  const obsMpu=sess.min/task.planUnits;                 // この実測から推定した1単位=分
  m.obs=(m.obs||[]).concat([Math.round(obsMpu)]);
  await putV('materials',m);
  if(m.obs.length%5===0){ proposeMpuUpdate(m); }        // 5件ごとに提案
}
function iqrMean(arr){
  if(arr.length<4) return Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
  const s=[...arr].sort((a,b)=>a-b), q=p=>{const i=(s.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i); return s[lo]+(s[hi]-s[lo])*(i-lo);};
  const q1=q(0.25), q3=q(0.75), iqr=q3-q1, lo=q1-1.5*iqr, hi=q3+1.5*iqr;
  const kept=s.filter(x=>x>=lo&&x<=hi); const use=kept.length?kept:s;
  return Math.round(use.reduce((a,b)=>a+b,0)/use.length);
}
function proposeMpuUpdate(m){
  const suggested=iqrMean(m.obs), cur=m.minutesPerUnit||30;
  if(suggested===cur){ return; }
  sheet(`<h2>実測にもとづく補正</h2>
    <div class="hint" style="margin-bottom:10px">教材「${esc(m.name)}」の実測が ${m.obs.length} 件たまりました。外れ値を除いた平均から、<b>1${esc(m.unitLabel||'単位')} = ${cur}分 → ${suggested}分</b> への更新を提案します。</div>
    <div class="actions"><button class="btn ghost" id="mpuKeep">据え置き</button><button class="btn primary" id="mpuUpd">更新する</button></div>`);
  $('#mpuKeep').onclick=closeSheet;
  $('#mpuUpd').onclick=async()=>{m.minutesPerUnit=suggested;await putV('materials',m);closeSheet();toast(`1${m.unitLabel||'単位'}=${suggested}分に更新しました`);};
}

/* ================= 分析 ================= */
function periodRange(){if(statPeriod==='all')return null;const now=new Date();
  if(statPeriod==='week'){const m=mondayOf(now);return[dstr(m),addDays(dstr(m),6)];}
  const s=new Date(now.getFullYear(),now.getMonth(),1),e=new Date(now.getFullYear(),now.getMonth()+1,0);return[dstr(s),dstr(e)];}
function inPeriod(sess){const r=periodRange();if(!r)return true;const d=dstr(new Date(sess.startTs));return d>=r[0]&&d<=r[1];}
function renderStats(){
  const td=today(),ws=dstr(mondayOf(new Date())),we=addDays(ws,6);
  const tMin=SESSIONS.filter(s=>dstr(new Date(s.startTs))===td).reduce((a,s)=>a+s.min,0);
  const wMin=SESSIONS.filter(s=>{const d=dstr(new Date(s.startTs));return d>=ws&&d<=we;}).reduce((a,s)=>a+s.min,0);
  $('#statToday').innerHTML=fmtDurBig(tMin);$('#statWeek').innerHTML=fmtDurBig(wMin);$('#statStreak').innerHTML=`${streak()}<small>日</small>`;
  renderStack(); renderBreakdown();
}
function streak(){const set=new Set(SESSIONS.map(s=>dstr(new Date(s.startTs))));let d=today();if(!set.has(d))d=addDays(d,-1);let n=0;while(set.has(d)){n++;d=addDays(d,-1);}return n;}
function renderStack(){
  const td=today(),days=[];for(let i=13;i>=0;i--)days.push(addDays(td,-i));
  const map={};days.forEach(d=>map[d]={});
  SESSIONS.forEach(s=>{const d=dstr(new Date(s.startTs));if(map[d])map[d][s.subject]=(map[d][s.subject]||0)+s.min;});
  const totals=days.map(d=>Object.values(map[d]).reduce((a,b)=>a+b,0));const mx=Math.max(1,...totals);
  const present=[];SESSIONS.forEach(s=>{if(map[dstr(new Date(s.startTs))]&&!present.includes(s.subject))present.push(s.subject);});
  const el=$('#stack');
  if(!present.length){el.innerHTML='<div class="emptybox" style="width:100%">まだ記録がありません。</div>';$('#stackLegend').innerHTML='';return;}
  el.innerHTML=days.map(d=>{const segs=map[d];const tot=Object.values(segs).reduce((a,b)=>a+b,0);const hpx=Math.round(tot/mx*100);
    const bars=Object.entries(segs).sort((a,b)=>colorOf(a[0])<colorOf(b[0])?-1:1).map(([n,m])=>`<div class="seg2" style="height:${Math.round(m/mx*100)}px;background:${colorOf(n)}"></div>`).join('');
    const dd=parseD(d);return `<div class="col${d===td?' today':''}"><div class="barwrap" style="height:${hpx}px">${bars}</div><div class="cl">${dd.getMonth()+1}/${dd.getDate()}</div></div>`;}).join('');
  $('#stackLegend').innerHTML=present.map(n=>`<span><span class="cdot" style="background:${colorOf(n)}"></span>${esc(n)}</span>`).join('');
}
function renderBreakdown(){
  const sess=SESSIONS.filter(inPeriod);const bySub={};sess.forEach(s=>bySub[s.subject]=(bySub[s.subject]||0)+s.min);
  const rows=Object.entries(bySub).sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...rows.map(r=>r[1]));
  const box=$('#breakdown');$('#bkHint').style.display=rows.length?'block':'none';
  if(!rows.length){box.innerHTML='<div class="emptybox">この期間の記録はありません。</div>';return;}
  box.innerHTML=rows.map(([sub,min])=>{
    const open=expanded.has(sub);
    let html=`<div class="bar sub" data-sub="${esc(sub)}"><div class="bl"><span class="caret">${open?'▾':'▸'}</span>${esc(sub)}</div><div class="btrack"><div class="bfill" style="width:${Math.max(3,min/max*100)}%;background:${colorOf(sub)}"></div></div><div class="bv num">${fmtDur(min)}</div></div>`;
    if(open){const byMat={};sess.filter(s=>s.subject===sub).forEach(s=>{const k=s.materialId?materialName(s.materialId):'（未分類）';byMat[k]=(byMat[k]||0)+s.min;});

const t2m=hhmm=>{const[h,m]=hhmm.split(':').map(Number);return h*60+m;};
function tmplCap(t){let hard=0,soft=0;(t.blocks||[]).forEach(b=>{const d=Math.max(0,t2m(b.e)-t2m(b.s));if(b.soft)soft+=d;else hard+=d;});return{hard,soft};}
const tmplById=id=>TEMPLATES.find(t=>t.id===id);
function weekCaps(weekDates){const caps={};weekDates.forEach(d=>{const t=ASSIGN[d]?tmplById(ASSIGN[d]):null;caps[d]=t?tmplCap(t):{hard:0,soft:0};});return caps;}

/* 純粋関数：配分エンジンv4
   科目週目標=総量。教材ターゲット(量)を分に換算し具体ピースとして優先配置。
   分割可=20分ブロック／分割不可=1単位。日に収まらない時は超過≤25かつ日次延長合計≤25なら押し込み、
   超えるなら別日へ、どこにも入らなければあふれ明示。フロアは科目日次下限（教材でも汎用でも充足）。
   残りは科目週目標まで汎用で充填。 */
function allocateV4(weekDates, caps, subjTargets, matTargets, mats, useSoft){
  const EXT=25, SPLIT=20;
  const perDay={}; weekDates.forEach(d=>perDay[d]={});   // key: subject|materialId -> {subject,materialId,min}
  const dayRemain={}, dayExt={}, daySubj={};
  weekDates.forEach(d=>{const c=caps[d]||{hard:0,soft:0}; dayRemain[d]=c.hard+(useSoft?c.soft:0); dayExt[d]=0; daySubj[d]={};});
  const capOf=d=>{const c=caps[d]||{hard:0,soft:0};return c.hard+(useSoft?c.soft:0);};
  const place=(d,subject,materialId,min)=>{const k=subject+'|'+(materialId||'');(perDay[d][k]||(perDay[d][k]={subject,materialId,min:0})).min+=min;daySubj[d][subject]=(daySubj[d][subject]||0)+min;};
  const weekSubj=subject=>weekDates.reduce((s,d)=>s+Object.values(perDay[d]).filter(p=>p.subject===subject).reduce((a,p)=>a+p.min,0),0);
  const shortfalls=[];

  // 1) 教材ピースを作る
  const blocks=[];
  matTargets.forEach(t=>{const m=mats[t.materialId]; if(!m||m.archived) return; const mpu=m.minutesPerUnit||30, units=t.unitsPerWeek||0; if(units<=0) return;
    if(m.splittable!==false){ let total=Math.round(units*mpu); while(total>0){const b=Math.min(SPLIT,total); blocks.push({subject:m.subjectName,materialId:m.id,min:b}); total-=b;} }
    else { const n=Math.round(units); for(let i=0;i<n;i++) blocks.push({subject:m.subjectName,materialId:m.id,min:mpu}); }
  });
  blocks.sort((a,b)=>b.min-a.min); // 大きいものから
  // 2) 配置：入る日→25分押し込み→あふれ
  blocks.forEach(blk=>{
    const order=[...weekDates].sort((x,y)=>dayRemain[y]-dayRemain[x]);
    let done=false;
    for(const d of order){ if(dayRemain[d]>=blk.min){ place(d,blk.subject,blk.materialId,blk.min); dayRemain[d]-=blk.min; done=true; break; } }
    if(done) return;
    for(const d of order){ if(capOf(d)<=0) continue; const overflow=blk.min-dayRemain[d];
      if(overflow>0 && overflow<=EXT && dayExt[d]+overflow<=EXT){ place(d,blk.subject,blk.materialId,blk.min); dayExt[d]+=overflow; dayRemain[d]=0; done=true; break; } }
    if(!done) shortfalls.push({type:'material',materialId:blk.materialId,subject:blk.subject,min:blk.min});
  });

  // 3) フロア（科目日次下限。教材で満たした分も算入）
  subjTargets.filter(t=>t.floorMin>0||t.floorPct>0).forEach(t=>{
    weekDates.forEach(d=>{ if(dayRemain[d]<=0) return;
      let need=Math.max(t.floorMin||0, Math.floor(capOf(d)*(t.floorPct||0)/100)); need=Math.round(need/5)*5;
      let add=need-(daySubj[d][t.subject]||0); if(add>0){ add=Math.min(add,dayRemain[d]); add=Math.floor(add/5)*5; if(add>0){ place(d,t.subject,null,add); dayRemain[d]-=add; } } });
  });

  // 4) 科目週目標まで汎用で充填（残キャパを最も不足の科目へ5分ずつ）
  weekDates.forEach(d=>{ let g=0;
    while(dayRemain[d]>=5 && g++<3000){ let best=null,need=0; subjTargets.forEach(t=>{const n=t.weeklyMin-weekSubj(t.subject); if(n>need){need=n;best=t.subject;}});
      if(!best) break; place(d,best,null,5); dayRemain[d]-=5; }
  });

  // 集計・不足
  const subjShort=subjTargets.map(t=>({subject:t.subject,short:Math.max(0,t.weeklyMin-weekSubj(t.subject))})).filter(x=>x.short>0);
  const matShortMap={}; shortfalls.filter(s=>s.type==='material').forEach(s=>matShortMap[s.materialId]=(matShortMap[s.materialId]||0)+s.min);
  const matShort=Object.entries(matShortMap).map(([id,min])=>({materialId:id,min,units:Math.round(min/(mats[id]?.minutesPerUnit||30)*10)/10}));
  const extensions=weekDates.filter(d=>dayExt[d]>0).map(d=>({date:d,min:dayExt[d]}));
  const surplus=weekDates.reduce((a,d)=>a+dayRemain[d],0);
  // perDay を配列に整形
  const out={}; weekDates.forEach(d=>{out[d]=Object.values(perDay[d]).filter(p=>p.min>0);});
  return {perDay:out, subjShort, matShort, extensions, surplus};
}

}
$('#aPrev').onclick=()=>{allocWeekStart=parseD(addDays(dstr(allocWeekStart),-7));renderAlloc();};
$('#aNext').onclick=()=>{allocWeekStart=parseD(addDays(dstr(allocWeekStart),7));renderAlloc();};
$('#aToday').onclick=()=>{allocWeekStart=mondayOf(new Date());renderAlloc();};
$('#tgCatchup').onclick=async()=>{CATCHUP=!CATCHUP;await setS('catchup',CATCHUP);renderAlloc();toast('キャッチアップ：'+(CATCHUP?'ON（ソフト枠も使用）':'OFF'));};
$('#mgTemplates').onclick=()=>openTemplates();
$('#mgTargets').onclick=()=>openTargets();

$('#doPreview').onclick=()=>{
  const ws=dstr(allocWeekStart),weekDates=[];for(let i=0;i<7;i++)weekDates.push(addDays(ws,i));
  const caps=weekCaps(weekDates);
  const totalCap=weekDates.reduce((a,d)=>a+caps[d].hard+(CATCHUP?caps[d].soft:0),0);
  if(totalCap<=0){toast('各日にテンプレートを割り当ててください');return;}
  const res=allocateV4(weekDates,caps,TARGETS,MATTARGETS,matsById(),CATCHUP);
  let h=`<h2>配分プレビュー</h2>`;
  weekDates.forEach(d=>{const items=res.perDay[d];if(!items.length)return;const dd=parseD(d);
    const ext=res.extensions.find(e=>e.date===d);
    h+=`<div class="pvday">${dd.getMonth()+1}/${dd.getDate()}（${wkOf(d)}）${ext?` <span style="color:var(--warn)">延長+${ext.min}分</span>`:''}</div>`;
    items.sort((x,y)=>y.min-x.min).forEach(p=>{const nm=p.materialId?materialName(p.materialId):p.subject;
      const ic=p.materialId&&matById(p.materialId)?matIconHTML(matById(p.materialId),'s'):`<span class="pd" style="background:${colorOf(p.subject)}"></span>`;
      const u=p.materialId?` <span style="color:var(--faint)">約${Math.round(p.min/mpuOf(p.materialId)*10)/10}${unitLabelOf(p.materialId)}</span>`:'';
      h+=`<div class="pvrow">${ic}<span class="pn">${esc(nm)}${u}</span><span class="pv num">${fmtDur(p.min)}</span></div>`;});});
  const probs=[];
  if(res.matShort.length) probs.push('教材が入り切りません：'+res.matShort.map(s=>`${esc(materialName(s.materialId))} あと${s.units}${unitLabelOf(s.materialId)}`).join(' ／ '));
  if(res.subjShort.length) probs.push('科目の週目標に未達：'+res.subjShort.map(s=>`${esc(s.subject)} あと${fmtDur(s.short)}`).join(' ／ '));
  if(probs.length) h+=`<div class="pvwarn">⚠ ${probs.join('<br>')}<br>${CATCHUP?'ソフト枠を含めても不足。テンプレ追加か目標見直しを。':'キャッチアップONでソフト枠を使うと解消する場合があります。'}</div>`;
  else h+=`<div class="pvok">✓ 週の目標をすべて満たせます${res.surplus?`（余剰 ${fmtDur(res.surplus)}）`:''}。</div>`;
  h+=`<div class="actions"><button class="btn ghost" id="pvCancel">閉じる</button><button class="btn primary" id="pvApply">確定して予定に反映</button></div>`;
  sheet(h);
  $('#pvCancel').onclick=closeSheet;
  $('#pvApply').onclick=async()=>{await applyAllocation(weekDates,res.perDay);closeSheet();toast('予定に反映しました');switchTab('plan');};
};
async function applyAllocation(weekDates,perDay){
  const rm=TASKS.filter(t=>t.origin==='auto'&&t.status!=='done'&&weekDates.includes(t.date));
  for(const t of rm)await delV('tasks',t.id);
  TASKS=TASKS.filter(t=>!(t.origin==='auto'&&t.status!=='done'&&weekDates.includes(t.date)));
  for(const d of weekDates){for(const p of (perDay[d]||[])){ if(p.min<=0) continue;
    const title=p.materialId?materialName(p.materialId):p.subject+'（配分）';
    const planUnits=p.materialId?Math.round(p.min/mpuOf(p.materialId)*100)/100:0;
    const rec={id:uid(),title,subject:p.subject,materialId:p.materialId||null,planUnits,date:d,time:'',plannedMin:p.min,status:'todo',carryCount:0,origin:'auto',createdTs:Date.now()};
    await putV('tasks',rec);TASKS.push(rec);}}
}

/* テンプレート管理 */
function openTemplates(){
  const rows=TEMPLATES.map((t,i)=>{const c=tmplCap(t);return `<div class="subrow"><span class="snm">${esc(t.name)} <span style="color:var(--faint);font-size:12px">${fmtDur(c.hard)}${c.soft?`+${c.soft}`:''}</span></span><button data-copy="${i}">複製</button><button data-edit="${i}">編集</button><button data-del="${i}">削除</button></div>`;}).join('');
  sheet(`<h2>日型テンプレート</h2>${rows}<div class="actions"><button class="btn primary" id="tAdd">新規追加</button></div>
    <div class="hint" style="margin-top:10px">「複製」で似た日型をすぐ作れます（バイトの時間帯違いなど）。ソフト枠は基本配分では使わず、キャッチアップON時のみ使われます。</div>`, e=>{
    const cp=e.target.closest('[data-copy]'),ed=e.target.closest('[data-edit]'),dl=e.target.closest('[data-del]');
    if(cp){const src=TEMPLATES[+cp.dataset.copy];TEMPLATES.push({id:uid(),name:src.name+' のコピー',blocks:src.blocks.map(b=>({...b}))});setS('templates',TEMPLATES).then(()=>editTemplate(TEMPLATES.length-1));}
    if(ed)editTemplate(+ed.dataset.edit);
    if(dl){const i=+dl.dataset.del;if(confirm(`「${TEMPLATES[i].name}」を削除しますか？`)){const did=TEMPLATES[i].id;TEMPLATES.splice(i,1);Object.keys(ASSIGN).forEach(k=>{if(ASSIGN[k]===did)delete ASSIGN[k];});Promise.all([setS('templates',TEMPLATES),setS('assign',ASSIGN)]).then(openTemplates);}}});
  $('#tAdd').onclick=()=>{TEMPLATES.push({id:uid(),name:'新しい日型',blocks:[{s:'09:00',e:'12:00',soft:false}]});setS('templates',TEMPLATES).then(()=>editTemplate(TEMPLATES.length-1));};
}
function blockRowHTML(b){return `<div class="blockrow"><input type="time" class="bs" value="${b.s}"><span style="color:var(--faint)">–</span><input type="time" class="be" value="${b.e}"><label class="soft"><input type="checkbox" class="bsoft"${b.soft?' checked':''}>ソフト</label><button class="rm" type="button">×</button></div>`;}
function editTemplate(idx){
  const t=TEMPLATES[idx];
  sheet(`<h2>テンプレートを編集</h2>
    <div class="field"><label>名前</label><input id="tName" value="${esc(t.name)}"></div>
    <div class="field"><label>勉強できる時間帯</label><div id="tBlocks">${t.blocks.map(b=>blockRowHTML(b)).join('')}</div>
      <button id="tAddBlock" type="button" style="background:none;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:9px;width:100%;margin-top:6px;font-size:13px">＋ 時間帯を追加</button></div>
    <div class="hint">「ソフト」は平日夜のような“できれば”の枠。基本配分では使わず、キャッチアップON時のみ使用。確実枠：<span id="tCap" class="num"></span></div>
    <div class="actions"><button class="btn ghost" id="tBack">戻る</button><button class="btn primary" id="tSave">保存</button></div>`);
  const collect=()=>[...$('#tBlocks').querySelectorAll('.blockrow')].map(r=>({s:r.querySelector('.bs').value||'00:00',e:r.querySelector('.be').value||'00:00',soft:r.querySelector('.bsoft').checked}));
  const refreshCap=()=>{const c=tmplCap({blocks:collect()});$('#tCap').textContent=fmtDur(c.hard)+(c.soft?`（+ソフト${c.soft}分）`:'');};
  const rewire=()=>{$('#tBlocks').querySelectorAll('.blockrow').forEach(r=>{r.querySelectorAll('input').forEach(inp=>inp.oninput=refreshCap);r.querySelector('.rm').onclick=()=>{r.remove();refreshCap();};});refreshCap();};
  $('#tAddBlock').onclick=()=>{const wrap=document.createElement('div');wrap.innerHTML=blockRowHTML({s:'09:00',e:'10:00',soft:false});$('#tBlocks').appendChild(wrap.firstElementChild);rewire();};
  $('#tBack').onclick=openTemplates;
  $('#tSave').onclick=async()=>{TEMPLATES[idx]={...t,name:$('#tName').value.trim()||'日型',blocks:collect()};await setS('templates',TEMPLATES);openTemplates();};
  rewire();
}

/* 目標・フロア管理 */
function openTargets(){
  const subjRows=SUBJECTS.map(s=>{const t=TARGETS.find(x=>x.subject===s.name)||{weeklyMin:0,floorMin:0,floorPct:0};
    return `<div class="tgrow" data-sub="${esc(s.name)}"><div class="tgn"><span class="cdot" style="background:${s.color}"></span>${esc(s.name)}</div>
      <label>週目標(時間)<input class="tw" type="number" inputmode="decimal" step="0.5" value="${(Math.round(t.weeklyMin/60*10)/10)||0}"></label>
      <label>毎日の下限(分)<input class="tf" type="number" inputmode="numeric" value="${t.floorMin||0}"></label>
      <label>下限(キャパ%)<input class="tp" type="number" inputmode="numeric" value="${t.floorPct||0}"></label></div>`;}).join('');
  const activeMats=MATERIALS.filter(m=>!m.archived);
  const matRows=MATTARGETS.length?MATTARGETS.map(mt=>{const m=matById(mt.materialId);if(!m)return'';return `<div class="mtrow" data-mid="${m.id}"><span class="cdot" style="background:${colorOf(m.subjectName)}"></span><span class="mtn">${esc(m.subjectName)} / ${esc(m.name)}</span><input class="mtu" type="number" inputmode="decimal" step="0.5" value="${mt.unitsPerWeek||0}"><span class="mtul">${esc(m.unitLabel||'単位')}/週</span><button class="mtdel" type="button">×</button></div>`;}).join(''):'<div class="hint">教材別ターゲットは未設定です。下で追加できます。</div>';
  const matOpts=activeMats.map(m=>`<option value="${m.id}">${esc(m.subjectName)} / ${esc(m.name)}</option>`).join('');
  sheet(`<h2>目標・フロア設定</h2>
    <div style="font-size:12px;color:var(--muted);margin:2px 0 6px">科目（週の総量）</div>${subjRows}
    <div style="font-size:12px;color:var(--muted);margin:16px 0 6px">教材別（量で指定・科目の総量の内訳）</div>
    <div id="mtList">${matRows}</div>
    <div class="mtadd"><select id="mtSel">${matOpts||'<option value="">（教材なし）</option>'}</select><input id="mtNum" type="number" inputmode="decimal" step="0.5" placeholder="量"><button class="btn ghost" id="mtAdd" style="padding:9px 12px">追加</button></div>
    <div style="margin-top:10px"><button class="btn ghost" id="mtJson" style="width:100%;font-size:13px">週次プランをJSONで取り込む</button></div>
    <div class="actions"><button class="btn primary" id="tgSave">保存</button></div>
    <div class="hint" style="margin-top:10px">「教材別」は量（例：公式問題集 2セット/週）で指定。内部で分に換算し、科目の週目標の内訳として優先配置します。合計は週キャパ(≈23h)以内に。</div>`, e=>{
    const del=e.target.closest('.mtdel'); if(del){del.closest('.mtrow').remove();}});
  $('#mtAdd').onclick=()=>{const id=$('#mtSel').value,num=parseFloat($('#mtNum').value)||0;if(!id||num<=0){toast('教材と量を入力');return;}const m=matById(id);
    if($('#mtList').querySelector(`[data-mid="${id}"]`)){toast('その教材は既に追加済みです');return;}
    const empty=$('#mtList').querySelector('.hint'); if(empty)empty.remove();
    const div=document.createElement('div');div.innerHTML=`<div class="mtrow" data-mid="${id}"><span class="cdot" style="background:${colorOf(m.subjectName)}"></span><span class="mtn">${esc(m.subjectName)} / ${esc(m.name)}</span><input class="mtu" type="number" inputmode="decimal" step="0.5" value="${num}"><span class="mtul">${esc(m.unitLabel||'単位')}/週</span><button class="mtdel" type="button">×</button></div>`;
    $('#mtList').appendChild(div.firstElementChild);$('#mtNum').value='';};
  $('#mtJson').onclick=()=>openJsonImport();
  $('#tgSave').onclick=async()=>{
    TARGETS=[...$('#sheet').querySelectorAll('.tgrow')].map(r=>({subject:r.dataset.sub,weeklyMin:Math.round((parseFloat(r.querySelector('.tw').value)||0)*60),floorMin:parseInt(r.querySelector('.tf').value)||0,floorPct:parseInt(r.querySelector('.tp').value)||0}));
    MATTARGETS=[...$('#sheet').querySelectorAll('.mtrow')].map(r=>({materialId:r.dataset.mid,unitsPerWeek:parseFloat(r.querySelector('.mtu').value)||0})).filter(x=>x.unitsPerWeek>0);
    await setS('targets',TARGETS);await setS('mattargets',MATTARGETS);closeSheet();
    const sum=TARGETS.reduce((a,t)=>a+t.weeklyMin,0);
    toast(sum>23*60?`保存（注意：科目週目標計 ${fmtDur(sum)} が23h超）`:'保存しました');
  };
}
/* 週次プランのJSON取り込み（手入力欄も兼ねる）
   形式例： {"materials":[{"subject":"TOEFL","name":"公式問題集","units":2}, ...]} */
function openJsonImport(){
  const sample=`{\n  "materials": [\n    {"subject":"TOEFL","name":"公式問題集","units":2},\n    {"subject":"専門科目","name":"神取ミクロ","units":1}\n  ]\n}`;
  sheet(`<h2>週次プランを取り込む</h2>
    <div class="hint" style="margin-bottom:8px">このチャットで決めた週次プランのJSONを貼り付け（または直接入力）してください。存在しない教材は科目に自動作成します（既定：1単位30分・分割可）。取り込み後は「目標・フロア」で微調整できます。</div>
    <div class="field"><textarea id="jsonBox" style="width:100%;height:180px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:12px;font-size:13px;font-family:inherit" placeholder='${sample.replace(/"/g,'&quot;')}'></textarea></div>
    <div class="actions"><button class="btn ghost" id="jBack">戻る</button><button class="btn primary" id="jApply">取り込む</button></div>`);
  $('#jBack').onclick=openTargets;
  $('#jApply').onclick=async()=>{
    let data; try{data=JSON.parse($('#jsonBox').value);}catch(e){toast('JSONの形式が不正です');return;}
    const list=(data&&data.materials)||[]; if(!list.length){toast('materials が空です');return;}
    let added=0;
    for(const it of list){ if(!it.subject||!it.name||!(it.units>0)) continue;
      let subObj=SUBJECTS.find(s=>s.name===it.subject);
      if(!subObj){subObj={name:it.subject,color:PALETTE[SUBJECTS.length%PALETTE.length]};SUBJECTS.push(subObj);await setS('subjects',SUBJECTS);}
      let m=MATERIALS.find(x=>x.subjectName===it.subject&&x.name===it.name&&!x.archived);
      if(!m){const id=await addMaterial(it.subject,it.name);m=matById(id); if(it.minutesPerUnit){m.minutesPerUnit=it.minutesPerUnit;} if(it.unitLabel){m.unitLabel=it.unitLabel;} if(typeof it.splittable==='boolean'){m.splittable=it.splittable;} await putV('materials',m);}
      const ex=MATTARGETS.find(x=>x.materialId===m.id); if(ex)ex.unitsPerWeek=it.units; else MATTARGETS.push({materialId:m.id,unitsPerWeek:it.units});
      added++;
    }
    await setS('mattargets',MATTARGETS);
    toast(`${added}件を取り込みました`); openTargets();
  };
}

/* ================= 自動更新 ================= */
const APP_VERSION='v5';
async function checkUpdate(){
  try{
    const r=await fetch('./version.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) return; const j=await r.json();
    if(j&&j.version&&j.version!==APP_VERSION) showUpdateBar(j.version);
  }catch(e){/* オフライン等は無視 */}
}
function showUpdateBar(v){
  if($('#updbar')) return;
  const bar=document.createElement('div'); bar.id='updbar'; bar.className='updbar';
  bar.innerHTML=`新しい版（${v}）があります <button id="updNow">更新</button>`;
  document.body.appendChild(bar);
  $('#updNow').onclick=async()=>{
    try{ if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const rg of regs)await rg.unregister();}
      if(window.caches){const ks=await caches.keys();for(const k of ks)await caches.delete(k);} }catch(e){}
    location.reload();
  };
}

/* ================= 起動 ================= */
async function init(){
  DB=await openDB(); await loadAll(); await loadAlloc(); applyTheme(await getS('theme','auto'));
  matchMedia('(prefers-color-scheme:dark)').addEventListener('change',async()=>{if((await getS('theme','auto'))==='auto')applyTheme('auto');});
  if(running)startTick();
  switchTab('plan');
  if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  checkUpdate();
}
init().catch(err=>{document.body.innerHTML='<p style="padding:24px;color:#e8ede9">起動に失敗しました。ページを再読み込みしてください。<br><small>'+err+'</small></p>';});
</script>
